# Paperless trusts the Remote-User header (set by Authelia forward-auth in Traefik).
# Only Traefik may reach the web port, so no other pod can spoof the header.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-web-only-from-traefik
  namespace: paperless-ngx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
      pod.name: main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
