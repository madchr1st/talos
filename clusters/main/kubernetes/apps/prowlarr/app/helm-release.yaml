---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  interval: 15m
  chart:
    spec:
      chart: prowlarr
      version: 25.1.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: prowlarr.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: forward-auth-authelia
                namespace: authelia
                expandObjectName: false
    persistence:
      # prowlarr.db (SQLite) -> block storage, copied from the K3s PVC (uid 568 as on K3s)
      config:
        enabled: true
        type: pvc
        size: 2Gi
        targetSelector:
          main:
            main:
              mountPath: /config
            exportarr:
              mountPath: /config
              readOnly: true
        storageClass: truenas-iscsi
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, media, monitoring
      ingress:
        enabled: true
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/media: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
    # Allowed Hosts: public names (Traefik) + in-cluster service names (Prowlarr, Seerr, Unpackerr, exportarr); localhost and the pod hostname are always allowed
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PROWLARR__SERVER__ALLOWEDHOSTS: prowlarr.${DOMAIN_0},prowlarr,prowlarr.prowlarr.svc,prowlarr.prowlarr.svc.cluster.local
