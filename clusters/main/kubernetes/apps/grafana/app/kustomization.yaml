apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-release.yaml
  - namespace.yaml
secretGenerator:
  - name: grafana-values-sec
    namespace: grafana
    files:
      - values-sec.yaml
configMapGenerator:
  # Hand-made dashboards migrated from the old TrueNAS K3s Grafana (2026-11-18).
  # Picked up by the dashboards sidecar (label grafana_dashboard=1).
  - name: grafana-dashboards-custom
    namespace: grafana
    files:
      # stock CloudNativePG dashboard (operator chart 0.29.2, grafanaDashboard.create off there), patched:
      # backup panels read the Barman Cloud plugin metrics, default range 24h (7d was slow)
      - dashboards/cloudnative-pg.json
      - dashboards/media-dashboard.json
      - dashboards/nvidia-gpu-metrics.json
      - dashboards/speedtest-custom.json
    options:
      disableNameSuffixHash: true
      annotations:
        # dashboards contain Grafana ${...} variables; keep Flux envsubst away
        kustomize.toolkit.fluxcd.io/substitute: disabled
      labels:
        grafana_dashboard: "1"
configurations:
  - kustomizeconfig.yaml
