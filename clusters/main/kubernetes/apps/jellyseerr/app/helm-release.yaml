---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
  namespace: jellyseerr
spec:
  interval: 15m
  chart:
    spec:
      chart: seerr
      version: 17.1.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: jellyseerr.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
      ext:
        enabled: true
        ingressClassName: traefik-external
        hosts:
          - host: jellyseerr.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
    persistence:
      # Jellyfin instance (Seerr supports one media server per instance): copied from the K3s PVC (uid 568 as on K3s)
      config:
        enabled: true
        type: pvc
        size: 2Gi
        mountPath: /app/config
    # Keep SQLite as on K3s (chart default is now Postgres). Switching to CNPG can come later.
    cnpg:
      main:
        enabled: false
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                DB_TYPE: sqlite
                DB_HOST: ""
                DB_PASS: ""
                DB_USER: ""
                DB_NAME: ""
