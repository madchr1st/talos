---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 15m
  chart:
    spec:
      chart: authelia
      version: 34.2.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  valuesFrom:
    - kind: Secret
      name: authelia-config
      valuesKey: authelia-config.yaml
  values:
    cnpg:
      main:
        mode: recovery
        backups:
          enabled: true
          credentials: mys3
          scheduledBackups:
            - name: daily-backup
              # Daily at midnight
              schedule: 0 0 0 * * *
              backupOwnerReference: self
              immediate: true
              suspend: false
          retentionPolicy: 30d
          # own WAL/backup path (<cluster>-r1): the old K3s cluster still archives to the un-suffixed one
          revision: "1"
        recovery:
          method: object_store
          credentials: mys3
        cluster:
          instances: 1
          singleNode: true
          storage:
            size: 5Gi
            storageClass: truenas-iscsi
          walStorage:
            size: 5Gi
            storageClass: truenas-iscsi
        database: ${CNPG_DB_AUTHELIA_NAME}
        enabled: true
        hibernate: false
        monitoring:
          disableDefaultQueries: false
          enablePodMonitor: true
        password: ${CNPG_DB_AUTHELIA_PASSWORD}
        pgVersion: 16
        pooler:
          enabled: false
        user: ${CNPG_DB_AUTHELIA_USER}
    database:
      type: postgresql
      wal: true
    credentials:
      mys3:
        type: s3
        url: ${CNPG_BACKUP_AWS_S3_URL}
        bucket: ${CNPG_BACKUP_AWS_S3_BUCKET}
        accessKey: ${CNPG_BACKUP_AWS_S3_ACCESS_KEY}
        secretKey: ${CNPG_BACKUP_AWS_S3_SECRET_KEY}
        encrKey: ${CNPG_BACKUP_AWS_S3_ENCRYPTION_KEY}
    ingress:
      ext:
        enabled: true
        hosts:
          - host: sso.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        ingressClassName: traefik-external
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
        required: true
      main:
        enabled: true
        primary: true
        hosts:
          - host: sso.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        ingressClassName: traefik-internal
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
        required: true
    persistence:
      config:
        autoPermissions:
          enabled: false
        enabled: true
        path: ${NFS_PATH_AUTHELIA_DATA}
        server: ${NFS_SERVER_0}
        mountPath: /config
        readOnly: false
        type: nfs
    redis:
      creds:
        redisPassword: ${REDIS_AUTHELIA_PASSWORD}
      enabled: true
      includeCommon: true
      password: ${REDIS_AUTHELIA_PASSWORD}
      persistence:
        data:
          size: 1Gi
          storageClass: truenas-iscsi
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 10m
        memory: 50Mi
    securityContext:
      container:
        UMASK: "0022"
        runAsGroup: 1000
        runAsUser: 1000
      pod:
        fsGroup: 1000
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, monitoring
      ingress:
        enabled: true
        policyType: ingress
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
