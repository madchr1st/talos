---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: syncthing
spec:
  interval: 15m
  chart:
    spec:
      chart: syncthing
      version: 24.1.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: sync.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: forward-auth-authelia
                namespace: authelia
                expandObjectName: false
      ext:
        enabled: true
        ingressClassName: traefik-external
        hosts:
          - host: sync.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: forward-auth-authelia
                namespace: authelia
                expandObjectName: false
    persistence:
      # index DB (SQLite) + keys -> block storage, copied from K3s; synced data stays on the NAS
      config:
        enabled: true
        type: pvc
        size: 2Gi
        mountPath: /var/syncthing
      data:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: /mnt/bulk-storage/downloads/k8s/syncthing/data
        mountPath: /data
        readOnly: false
        autoPermissions:
          enabled: false
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: false
      pod:
        fsGroup: 1000
    service:
      listeners:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: 192.168.10.218
        integrations:
          metallb:
            enabled: true
      listeners-udp:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: 192.168.10.218
        integrations:
          metallb:
            enabled: true
      discovery:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: 192.168.10.218
        integrations:
          metallb:
            enabled: true
    # Ingress only (egress stays open). Kubelet probes come from the host and are always allowed.
    networkPolicy:
      # same namespace, Traefik, Prometheus, CNPG operator, LoadBalancer/LAN ports
      ingress:
        enabled: true
        policyType: ingress
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
          - from:
              - namespaceSelector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - traefik-internal
                        - traefik-external
                        - kube-prometheus-stack
                        - cloudnative-pg
          - from:
              - ipBlock:
                  cidr: 0.0.0.0/0
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: tailscale
            ports:
              - port: 22000
                protocol: TCP
              - port: 22000
                protocol: UDP
              - port: 21027
                protocol: UDP
