---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: plex
spec:
  interval: 15m
  chart:
    spec:
      chart: plex
      version: 23.1.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: plex.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${PLEX_IP}
        integrations:
          metallb:
            enabled: true
    plex:
      # advertised to clients; the UDR forwards WAN 32400 here
      serverIP: ${PLEX_IP}
      disableGDM: true
      requireHTTPS: false
    persistence:
      # Preferences.xml + library DB stay on the NAS (as on K3s), media read from NFS
      config:
        enabled: true
        type: pvc
        mountPath: /config
        size: 40Gi
      media:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_MULTIMEDIA}
        mountPath: /data
        autoPermissions:
          enabled: false
      transcode:
        enabled: true
        type: emptyDir
        # on disk, not RAM: large segments when the GPU transcodes 4K
        medium: ""
        mountPath: /transcode
        targetSelectAll: true
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: false
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    resources:
      limits:
        cpu: 2000m
        memory: 6Gi
        nvidia.com/gpu: 1
      requests:
        cpu: 500m
        memory: 1Gi
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, media, monitoring + LoadBalancer/LAN ports
      ingress:
        enabled: true
        policyType: ingress
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/media: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
          - from:
              - ipBlock:
                  cidr: 0.0.0.0/0
              - namespaceSelector:
                  matchLabels:
                    policy-group/tailscale: "true"
            ports:
              - port: 32400
                protocol: TCP
    workload:
      main:
        podSpec:
          runtimeClassName: nvidia
