---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest-tracker
  namespace: speedtest-tracker
spec:
  interval: 15m
  chart:
    spec:
      chart: speedtest-tracker
      version: 14.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Zurich
    credentials:
      mys3:
        type: s3
        url: ${CNPG_BACKUP_AWS_S3_URL}
        bucket: ${CNPG_BACKUP_AWS_S3_BUCKET}
        accessKey: ${CNPG_BACKUP_AWS_S3_ACCESS_KEY}
        secretKey: ${CNPG_BACKUP_AWS_S3_SECRET_KEY}
        encrKey: ${CNPG_BACKUP_AWS_S3_ENCRYPTION_KEY}
    persistence:
      config:
        enabled: true
        type: pvc
        size: 1Gi
        storageClass: truenas-iscsi
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                APP_URL: https://speedtest.${DOMAIN_0}
                APP_TIMEZONE: Europe/Zurich
                DISPLAY_TIMEZONE: Europe/Zurich
                # every 3 hours at :17 (~1 GB per test on a gigabit line)
                SPEEDTEST_SCHEDULE: "17 */3 * * *"
                PRUNE_RESULTS_OLDER_THAN: "365"
                PUBLIC_DASHBOARD: false
    # Prometheus export: enabled in the UI (Settings > Data Integrations), scraped at /prometheus on the main service
    metrics:
      main:
        enabled: true
        type: servicemonitor
        endpoints:
          - port: main
            path: /prometheus
            interval: 5m
        targetSelector: main
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, monitoring
      ingress:
        enabled: true
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
    dependencies:
      postgresql:
        enabled: true
        depconfig:
          postgresqlUsername: speedtest-tracker
          postgresqlDatabase: speedtest-tracker
          password: ${CNPG_DB_SPEEDTEST_TRACKER_PASSWORD}
        operator:
          cluster:
            # single node: a 2nd instance adds RAM but no real HA; S3 backups stay enabled
            instances: 1
            singleNode: true
            storage:
              size: 2Gi
              storageClass: truenas-iscsi
            walStorage:
              size: 2Gi
              storageClass: truenas-iscsi
          monitoring:
            enablePodMonitor: true
          backups:
            enabled: true
            credentials: mys3
            scheduledBackups:
              - name: daily-backup
                schedule: "0 0 0 * * *"
                backupOwnerReference: self
                immediate: true
                suspend: false
            retentionPolicy: 30d
            revision: "1" # new System ID after the major upgrade: new archive folder (serverName -r1)
          pgVersion: 18
      valkey:
        persistence:
          data:
            size: 1Gi
        depconfig:
          password: ${VALKEY_SPEEDTEST_TRACKER_PASSWORD}
    # Gateway API (migration/GATEWAY-API.md): TLS by the wildcard on the Gateway listener; integrations.traefik.enabled
    # keeps the chart's tc-basic-secure-headers middleware. Authelia: namespace-local middleware copy (ingressMiddlewares).
    route:
      main:
        enabled: true
        primary: true
        kind: HTTPRoute
        gateway: internal
        gatewayNamespace: traefik-internal
        hostnames:
          - speedtest.${DOMAIN_0}
        integrations:
          traefik:
            enabled: true
            middlewares:
              - name: forward-auth-authelia
    ingressMiddlewares:
      traefik:
        forward-auth-authelia:
          enabled: true
          type: forward-auth
          data:
            address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
            trustForwardHeader: false
            authResponseHeaders:
              - Remote-User
              - Remote-Groups
              - Remote-Name
              - Remote-Email
