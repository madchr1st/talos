---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: syncthing
spec:
  interval: 15m
  chart:
    spec:
      chart: syncthing
      version: 25.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    persistence:
      # index DB (SQLite) + keys -> block storage, copied from K3s; synced data stays on the NAS
      config:
        enabled: true
        type: pvc
        size: 2Gi
        mountPath: /var/syncthing
        storageClass: truenas-iscsi
      data:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_SYNCTHING_DATA}
        mountPath: /data
        readOnly: false
        autoPermissions:
          enabled: false
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: false
      pod:
        fsGroup: 1000
    service:
      listeners:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${SYNCTHING_IP}
        integrations:
          metallb:
            enabled: true
      listeners-udp:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${SYNCTHING_IP}
        integrations:
          metallb:
            enabled: true
      discovery:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${SYNCTHING_IP}
        integrations:
          metallb:
            enabled: true
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, monitoring + LoadBalancer/LAN ports
      ingress:
        enabled: true
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
          - from:
              - ipBlock:
                  cidr: 0.0.0.0/0
              - namespaceSelector:
                  matchLabels:
                    policy-group/tailscale: "true"
            ports:
              - port: 22000
                protocol: TCP
              - port: 22000
                protocol: UDP
              - port: 21027
                protocol: UDP
    # Gateway API (migration/GATEWAY-API.md): TLS by the wildcard on the Gateway listener; integrations.traefik.enabled
    # keeps the chart's tc-basic-secure-headers middleware. Authelia: namespace-local middleware copy (ingressMiddlewares).
    route:
      main:
        enabled: true
        kind: HTTPRoute
        gateway: internal
        gatewayNamespace: traefik-internal
        hostnames:
          - sync.${DOMAIN_0}
        integrations:
          traefik:
            enabled: true
            middlewares:
              - name: forward-auth-authelia
      ext:
        enabled: true
        primary: false
        kind: HTTPRoute
        gateway: external
        gatewayNamespace: traefik-external
        hostnames:
          - sync.${DOMAIN_0}
        integrations:
          traefik:
            enabled: true
            middlewares:
              - name: forward-auth-authelia
    ingressMiddlewares:
      traefik:
        forward-auth-authelia:
          enabled: true
          type: forward-auth
          data:
            address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
            trustForwardHeader: false
            authResponseHeaders:
              - Remote-User
              - Remote-Groups
              - Remote-Name
              - Remote-Email
