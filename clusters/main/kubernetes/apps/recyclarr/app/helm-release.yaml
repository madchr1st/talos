---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
  namespace: recyclarr
spec:
  interval: 15m
  chart:
    spec:
      chart: recyclarr
      version: 16.2.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  valuesFrom:
    # SOPS-encrypted secrets (values-sec.yaml)
    - kind: Secret
      name: recyclarr-values-sec
      valuesKey: values-sec.yaml
  values:
    TZ: Europe/Zurich
    # recyclarr.yml lives in Git (configmap); API keys come from values-sec.yaml (secret "api-keys").
    # Only the TRaSH profiles below are managed; the existing hand-made profiles stay untouched.
    # Default TRaSH CF groups only: the optional Golden Rule (x265 penalty) is not synced.
    configmap:
      config:
        enabled: true
        data:
          recyclarr.yml: |
            # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
            sonarr:
              sonarr:
                base_url: http://sonarr.sonarr.svc.cluster.local:8989
                api_key: !env_var SONARR_API_KEY
                delete_old_custom_formats: true
                quality_definition:
                  type: series
                quality_profiles:
                  - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
                    reset_unmatched_scores:
                      enabled: true
                  - trash_id: d1498e7d189fbe6c7110ceaabb7473e6  # WEB-2160p
                    reset_unmatched_scores:
                      enabled: true
            radarr:
              radarr:
                base_url: http://radarr.radarr.svc.cluster.local:7878
                api_key: !env_var RADARR_API_KEY
                delete_old_custom_formats: true
                quality_definition:
                  type: movie
                quality_profiles:
                  - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
                    reset_unmatched_scores:
                      enabled: true
                  - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
                    reset_unmatched_scores:
                      enabled: true
    workload:
      main:
        podSpec:
          initContainers:
            # config comes from Git, no generated template
            initconfig:
              enabled: false
          containers:
            main:
              env:
                CRON_SCHEDULE: "@daily"
              envFrom:
                - secretRef:
                    name: api-keys
    persistence:
      # repo cache + logs
      config:
        enabled: true
        type: pvc
        size: 1Gi
        mountPath: /config
      recyclarr-yml:
        enabled: true
        type: configmap
        objectName: config
        mountPath: /config/recyclarr.yml
        subPath: recyclarr.yml
        readOnly: true
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, media, monitoring
      ingress:
        enabled: true
        policyType: ingress
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/media: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
