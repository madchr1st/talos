---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflareddns
  namespace: cloudflareddns
spec:
  interval: 15m
  chart:
    spec:
      chart: cloudflareddns
      version: 16.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                UPDATE_IPV6: false
                DETECTION_MODE: "dig-whoami.cloudflare"
                LOG_LEVEL: 3
                CF_APITOKEN: ${DOMAIN_0_CLOUDFLARE_TOKEN}
                CF_HOSTS: "cname.${DOMAIN_0}"
                INTERVAL: 300
    persistence:
      config:
        enabled: false
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, monitoring
      ingress:
        enabled: true
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
