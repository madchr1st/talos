---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden-test
  namespace: vaultwarden-test
spec:
  interval: 15m
  chart:
    spec:
      chart: vaultwarden
      version: 32.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    credentials:
      mys3:
        type: s3
        url: ${CNPG_BACKUP_AWS_S3_URL}
        bucket: ${CNPG_BACKUP_AWS_S3_BUCKET}
        accessKey: ${CNPG_BACKUP_AWS_S3_ACCESS_KEY}
        secretKey: ${CNPG_BACKUP_AWS_S3_SECRET_KEY}
        encrKey: ${CNPG_BACKUP_AWS_S3_ENCRYPTION_KEY}
    database:
      type: postgresql
      wal: true
    ingress:
      main:
        enabled: true
        hosts:
          - host: bitwarden-test.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        ingressClassName: traefik-internal
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
          traefik:
            enabled: true
            entrypoints:
              - websecure
            forceTLS: true
            middlewares:
              - name: forward-auth-authelia
                namespace: authelia
                expandObjectName: false
      ext:
        enabled: true
        hosts:
          - host: bitwarden-test.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        ingressClassName: traefik-external
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
          traefik:
            enabled: true
            entrypoints:
              - websecure
            forceTLS: true
            middlewares:
              - name: forward-auth-authelia
                namespace: authelia
                expandObjectName: false
    persistence:
      data:
        autoPermissions:
          enabled: false
        enabled: true
        path: "${NFS_PATH_VAULTWARDEN_TEST_DATA}"
        server: "${NFS_SERVER_0}"
        mountPath: /data
        readOnly: false
        type: nfs
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 10m
        memory: 50Mi
    securityContext:
      container:
        UMASK: "0022"
        runAsGroup: 1000
        runAsUser: 1000
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: []
    service:
      main:
        enabled: true
        ports:
          main:
            port: 10102
            targetPort: 8080
        type: ClusterIP
    vaultwarden:
      admin:
        disableAdminToken: false
        enabled: true
        token: "${VAULTWARDEN_TEST_ADMIN_TOKEN}"
      allowInvitation: true
      allowSignups: false
      attachmentLimitOrg: ""
      attachmentLimitUser: ""
      defaultInviteName: ""
      emailAttempts: 3
      emailTokenExpiration: 600
      enableWebVault: true
      hibpApiKey: ""
      icons:
        cache: 2592000
        disableDownload: false
        token: 2592000
      log:
        file: ""
        level: info
      orgCreationUsers: all
      push:
        enabled: true
        installationId: "${VAULTWARDEN_TEST_PUSH_INSTALL_ID}"
        installationKey: "${VAULTWARDEN_TEST_PUSH_INSTALL_KEY}"
      requireEmail: true
      showPasswordHint: true
      signupwhitelistenable: false
      smtp:
        authMechanism: Plain
        enabled: true
        from: vaultwarden-test@${DOMAIN_0}
        fromName: vaultwarden-test
        heloName: ""
        host: "${VAULTWARDEN_TEST_SMTP_HOST}"
        invalidCertificate: false
        invalidHostname: false
        password: "${VAULTWARDEN_TEST_SMTP_PASSWORD}"
        port: 465
        security: force_tls
        timeout: 15
        user: "${VAULTWARDEN_TEST_SMTP_USER}"
      verifySignup: true
      yubico:
        enabled: false
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, monitoring
      ingress:
        enabled: true
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
    dependencies:
      postgresql:
        enabled: true
        depconfig:
          postgresqlUsername: "${CNPG_DB_VAULTWARDEN_TEST_USER}"
          postgresqlDatabase: "${CNPG_DB_VAULTWARDEN_TEST_NAME}"
          password: ${CNPG_DB_VAULTWARDEN_TEST_PASSWORD}
        operator:
          mode: recovery
          backups:
            enabled: true
            credentials: mys3
            scheduledBackups:
              - name: daily-backup
                schedule: "0 0 0 * * *" # Daily at midnight
                backupOwnerReference: self
                immediate: true
                suspend: false
            retentionPolicy: "30d"
            # own WAL/backup path (<cluster>-r1): the old K3s cluster still archives to the un-suffixed one
            revision: "1"
          recovery:
            method: object_store
            credentials: mys3
          cluster:
            instances: 1
            singleNode: true
            storage:
              size: 5Gi
              storageClass: truenas-iscsi
            walStorage:
              size: 5Gi
              storageClass: truenas-iscsi
          hibernate: false
          monitoring:
            disableDefaultQueries: false
            enablePodMonitor: true
          pgVersion: 16
          pooler:
            enabled: false
