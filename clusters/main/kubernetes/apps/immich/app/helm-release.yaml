---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 15m
  chart:
    spec:
      chart: immich
      version: 36.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    credentials:
      mys3:
        type: s3
        url: ${CNPG_BACKUP_AWS_S3_URL}
        bucket: ${CNPG_BACKUP_AWS_S3_BUCKET}
        accessKey: ${CNPG_BACKUP_AWS_S3_ACCESS_KEY}
        secretKey: ${CNPG_BACKUP_AWS_S3_SECRET_KEY}
        encrKey: ${CNPG_BACKUP_AWS_S3_ENCRYPTION_KEY}
    persistence:
      # photos/videos stay on the NAS (as on K3s), uid 1000
      library:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_LIBRARY}
        autoPermissions:
          enabled: false
      uploads:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_UPLOAD}
        autoPermissions:
          enabled: false
      backups:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_BACKUPS}
        autoPermissions:
          enabled: false
      thumbs:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_THUMBS}
        autoPermissions:
          enabled: false
      video:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_VIDEO}
        autoPermissions:
          enabled: false
      profile:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_PROFILE}
        autoPermissions:
          enabled: false
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, monitoring
      ingress:
        enabled: true
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
    dependencies:
      postgresql:
        enabled: true
        depconfig:
          postgresqlUsername: immich
          postgresqlDatabase: immich
          password: ${CNPG_DB_IMMICH_PASSWORD}
        operator:
          pgVersion: 16
          # VectorChord (Immich 3.x); migrated from pgvecto.rs on 2026-11-19 (migration/UPGRADE-PAPERLESS-IMMICH.md)
          type: vectorchord
          # Bootstrapped from the K3s cluster's S3 backup + WAL (s3://.../immich/cnpg)
          mode: recovery
          recovery:
            method: object_store
            credentials: mys3
          cluster:
            instances: 1
            singleNode: true
            storage:
              size: 10Gi
              storageClass: truenas-iscsi
            walStorage:
              size: 5Gi
              storageClass: truenas-iscsi
          monitoring:
            enablePodMonitor: true
          backups:
            enabled: true
            # new server name (-r1) so Talos never writes into the K3s backup
            revision: "1"
            credentials: mys3
            scheduledBackups:
              - name: daily-backup
                schedule: "0 0 0 * * *"
                backupOwnerReference: self
                immediate: true
                suspend: false
            retentionPolicy: 30d
      valkey:
        persistence:
          data:
            size: 1Gi
        depconfig:
          password: ${VALKEY_IMMICH_PASSWORD}
    # Gateway API (migration/GATEWAY-API.md): TLS by the wildcard on the Gateway listener; integrations.traefik.enabled
    # keeps the chart's tc-basic-secure-headers middleware. Authelia: namespace-local middleware copy (ingressMiddlewares).
    route:
      main:
        enabled: true
        kind: HTTPRoute
        gateway: internal
        gatewayNamespace: traefik-internal
        hostnames:
          - photos.${DOMAIN_0}
        integrations:
          traefik:
            enabled: true
      ext:
        enabled: true
        primary: false
        kind: HTTPRoute
        gateway: external
        gatewayNamespace: traefik-external
        hostnames:
          - photos.${DOMAIN_0}
        integrations:
          traefik:
            enabled: true
