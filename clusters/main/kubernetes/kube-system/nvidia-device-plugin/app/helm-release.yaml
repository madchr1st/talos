---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  interval: 15m
  chart:
    spec:
      chart: nvidia-device-plugin
      version: 0.20.2
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
        namespace: flux-system
      interval: 15m
  timeout: 10m
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Only schedules on nodes with an NVIDIA PCI device (NFD label feature.node.kubernetes.io/pci-10de.present, chart default affinity).
  values:
    runtimeClassName: nvidia
    # GTX 1060 shared by Plex and Jellyfin: time-slicing advertises 2 nvidia.com/gpu per physical GPU
    config:
      default: default
      map:
        default: |
          version: v1
          sharing:
            timeSlicing:
              resources:
                - name: nvidia.com/gpu
                  replicas: 2
