---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 15m
  chart:
    spec:
      chart: gatus
      version: 5.3.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  valuesFrom:
    # SOPS-encrypted secrets (values-sec.yaml)
    - kind: Secret
      name: gatus-values-sec
      valuesKey: values-sec.yaml
  values:
    TZ: Europe/Zurich
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: gatus.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: forward-auth-authelia
                namespace: authelia
                expandObjectName: false
    cnpg:
      main:
        enabled: true
        user: gatus
        database: gatus
        cluster:
          # single node: a 2nd instance adds RAM but no real HA; S3 backups stay enabled
          instances: 1
          singleNode: true
          storage:
            size: 2Gi
          walStorage:
            size: 2Gi
        monitoring:
          enablePodMonitor: true
        backups:
          enabled: true
          credentials: mys3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 0 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          retentionPolicy: 30d
    credentials:
      mys3:
        type: s3
        url: ${CNPG_BACKUP_AWS_S3_URL}
        bucket: ${CNPG_BACKUP_AWS_S3_BUCKET}
        accessKey: ${CNPG_BACKUP_AWS_S3_ACCESS_KEY}
        secretKey: ${CNPG_BACKUP_AWS_S3_SECRET_KEY}
        encrKey: ${CNPG_BACKUP_AWS_S3_ENCRYPTION_KEY}
    configmap:
      config:
        enabled: true
        data:
          config.yaml: |
            {{- if .Values.cnpg.main.enabled }}
            storage:
              type: postgres
              path: {{ (printf "%s?client_encoding=utf8" (.Values.cnpg.main.creds.std | trimAll "\"")) | quote }}
            {{- end }}
            metrics: true
            ui:
              title: Status
              header: Status
            alerting:
              ntfy:
                url: http://ntfy.ntfy.svc.cluster.local:10222
                topic: gatus
                # double dollar = escaped for Flux; Gatus expands the variable from its env (secret from values-sec.yaml)
                token: $${NTFY_TOKEN}
                priority: 4
                default-alert:
                  enabled: true
                  failure-threshold: 3
                  success-threshold: 2
                  send-on-resolved: true
            endpoints:
              - name: Authelia
                group: Auth
                url: "http://authelia.authelia.svc.cluster.local:9091/api/health"
                interval: 2m
                conditions:
                  - "[STATUS] == 200"
                alerts:
                  - type: ntfy
              - name: LLDAP
