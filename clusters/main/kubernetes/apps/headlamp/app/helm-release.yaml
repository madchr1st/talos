---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 15m
  chart:
    spec:
      chart: headlamp
      version: 3.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Zurich
    # Login: Authelia (2FA, dedicated rule without the /api bypass) + a read-only cluster-wide service account token.
    # allowEditing: true would give the UI write access (cluster-admin-like) -- Flux reverts drift anyway.
    headlamp:
      auth:
        unsafeServiceToken:
          enabled: true
          allowEditing: false
    podOptions:
      priorityClassName: ""
    # Read-only role WITHOUT secrets and configmaps (cluster-config holds decrypted credentials).
    # The chart default would be get/list/watch on */* (incl. secrets).
    rbac:
      main:
        rules:
          - apiGroups: [""]
            resources: [namespaces, nodes, pods, pods/log, services, endpoints, persistentvolumeclaims, persistentvolumes, events, serviceaccounts, resourcequotas, limitranges, replicationcontrollers]
            verbs: [get, list, watch]
          - apiGroups: [apps, batch, autoscaling, policy, networking.k8s.io, discovery.k8s.io, events.k8s.io, storage.k8s.io, snapshot.storage.k8s.io, scheduling.k8s.io, node.k8s.io, coordination.k8s.io, apiextensions.k8s.io, metrics.k8s.io, gateway.networking.k8s.io, cilium.io, helm.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, source.toolkit.fluxcd.io, notification.toolkit.fluxcd.io, image.toolkit.fluxcd.io, cert-manager.io, acme.cert-manager.io, postgresql.cnpg.io, traefik.io, metallb.io, monitoring.coreos.com, upgrade.cattle.io]
            resources: ["*"]
            verbs: [get, list, watch]
          - apiGroups: [rbac.authorization.k8s.io]
            resources: [roles, rolebindings, clusterroles, clusterrolebindings]
            verbs: [get, list, watch]
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress-internal, monitoring
      ingress:
        enabled: true
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress-internal: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
    # Gateway API (migration/GATEWAY-API.md): TLS by the wildcard on the Gateway listener; integrations.traefik.enabled
    # keeps the chart's tc-basic-secure-headers middleware. Authelia: namespace-local middleware copy (ingressMiddlewares).
    route:
      main:
        enabled: true
        primary: true
        kind: HTTPRoute
        gateway: internal
        gatewayNamespace: traefik-internal
        hostnames:
          - headlamp.${DOMAIN_0}
        integrations:
          traefik:
            enabled: true
            middlewares:
              - name: forward-auth-authelia
    ingressMiddlewares:
      traefik:
        forward-auth-authelia:
          enabled: true
          type: forward-auth
          data:
            address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
            trustForwardHeader: false
            authResponseHeaders:
              - Remote-User
              - Remote-Groups
              - Remote-Name
              - Remote-Email
