---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: seerr
spec:
  interval: 15m
  chart:
    spec:
      chart: seerr
      version: 18.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    persistence:
      # Plex instance: db.sqlite3 + settings.json -> block storage, copied from K3s
      config:
        enabled: true
        type: pvc
        size: 2Gi
        storageClass: truenas-iscsi
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: false
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    # Keep SQLite as on K3s (chart default is now Postgres). Switching to CNPG can come later.
    cnpg:
      main:
        enabled: false
    # Common 2026 (chart 18+) enables PostgreSQL by default; this app keeps SQLite
    dependencies:
      postgresql:
        enabled: false
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                DB_TYPE: sqlite
                DB_HOST: ""
                DB_PASS: ""
                DB_USER: ""
                DB_NAME: ""
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, media, monitoring
      ingress:
        enabled: true
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/media: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
    # Gateway API (migration/GATEWAY-API.md): TLS by the wildcard on the Gateway listener; integrations.traefik.enabled
    # keeps the chart's tc-basic-secure-headers middleware. Authelia: namespace-local middleware copy (ingressMiddlewares).
    route:
      main:
        enabled: true
        kind: HTTPRoute
        gateway: internal
        gatewayNamespace: traefik-internal
        hostnames:
          - request.${DOMAIN_0}
        integrations:
          traefik:
            enabled: true
      ext:
        enabled: true
        primary: false
        kind: HTTPRoute
        gateway: external
        gatewayNamespace: traefik-external
        hostnames:
          - request.${DOMAIN_0}
        integrations:
          traefik:
            enabled: true
