---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
  namespace: adguard-home
spec:
  interval: 15m
  chart:
    spec:
      chart: adguard-home
      version: 14.1.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    workload:
      main:
        # W3: 0 until AdGuardHome.yaml has been copied from K3s, then removed
        replicas: 0
    service:
      # LAN DNS on its own IP; runs in parallel with the K3s AdGuard (.150) until the UDR DHCP DNS points here
      dns-tcp:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: 192.168.10.216
        integrations:
          metallb:
            enabled: true
      dns-udp:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: 192.168.10.216
        integrations:
          metallb:
            enabled: true
      # TLS is disabled in AdGuardHome.yaml: no DoH/DoT/DoQ/DNSCrypt listeners
      dns-https:
        enabled: false
      dns-https-udp:
        enabled: false
      dns-crypt:
        enabled: false
      dns-crypt-udp:
        enabled: false
      dns-quic-udp-1:
        enabled: false
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: adguard.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: forward-auth-authelia
                namespace: authelia
                expandObjectName: false
    persistence:
      # AdGuardHome.yaml + sessions copied from K3s (root-owned: block storage, NFS squashes root).
      # Query log / stats start fresh, filter lists are downloaded again.
      config:
        enabled: true
        type: pvc
        size: 1Gi
        mountPath: /opt/adguardhome/conf
      data:
        enabled: true
        type: pvc
        size: 5Gi
        mountPath: /opt/adguardhome/work
