# Ingress only (egress stays open). Trek is not a TrueCharts chart, so a plain NetworkPolicy by policy group
# (same model as migration/tools/gen-netpols.py). Kubelet probes come from the host and are always allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trek-ingress
  namespace: trek
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              policy-group/ingress: "true"
        - namespaceSelector:
            matchLabels:
              policy-group/monitoring: "true"
