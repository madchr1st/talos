apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  path: ./config/crd
  # CRDs: never delete them (that would delete every Gateway and route)
  prune: false
  sourceRef:
    kind: GitRepository
    name: gateway-api
