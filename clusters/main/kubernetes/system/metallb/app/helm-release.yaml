apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb
spec:
  interval: 5m
  chart:
    spec:
      chart: metallb
      version: 0.16.2
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # L2 only (no BGP peers): FRR-k8s is only needed for BGP. Its hostNetwork
    # statuscleaner Deployment cannot roll on a single node (port 19443 conflict).
    frrk8s:
      enabled: false
    speaker:
      ignoreExcludeLB: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    prometheus:
      serviceAccount: kube-prometheus-stack-prometheus
      namespace: kube-prometheus-stack
      # Prometheus Operator ServiceMonitors. To be used as an alternative
      # to podMonitor, supports secure metrics.
      serviceMonitor:
        # enable support for Prometheus Operator
        enabled: true
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
