---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: traefik-internal
spec:
  interval: 15m
  chart:
    spec:
      chart: traefik
      version: 42.4.1
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # https://artifacthub.io/packages/helm/traefik/traefik?modal=values
    deployment:
      enabled: true
      replicas: 2
    service:
      enabled: true
      annotations:
        metallb.io/ip-allocated-from-pool: main
        metallb.io/loadBalancerIPs: ${TRAEFIK_INTERNAL_IP}
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local
    log:
      level: INFO
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop
    ingressClass:
      enabled: true
      isDefaultClass: true
    tlsOptions:
      default:
        minVersion: VersionTLS12
        maxVersion: VersionTLS13
        sniStrict: true
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
        allowExternalNameServices: true
        ingressClass: traefik-internal
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
        ingressClass: traefik-internal
      kubernetesGateway:
        # -- Enable Traefik Gateway provider for Gateway API
        enabled: false
    # tlsStore: 
    #   default:
    #     defaultCertificate:
    #     secretName: "${SECRET_PUBLIC_DOMAIN/./-}-tls"
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          tls:
            enabled: true
            options: "default"
    ingressRoute:
      # Dashboard on https://traefik.${DOMAIN_0} (LAN/tailnet), behind Authelia. Authelia has dedicated rules for this host ahead of its global /api bypass, so the dashboard API is protected too.
      dashboard:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: traefik-internal
        matchRule: Host(`traefik.${DOMAIN_0}`)
        entryPoints:
          - websecure
        middlewares:
          - name: forward-auth-authelia
            namespace: authelia
        tls:
          secretName: traefik-dashboard-tls
    metrics:
      ## Prometheus is enabled by default.
      ## It can be disabled by setting "prometheus: null"
      prometheus:
        service:
          # -- Create a dedicated metrics service to use with ServiceMonitor
          enabled: true
        # -- When set to true, it won't check if Prometheus Operator CRDs are deployed
        serviceMonitor:
          # -- Enable optional CR for Prometheus Operator. See EXAMPLES.md for more details.
          enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
