---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: plex
spec:
  interval: 15m
  chart:
    spec:
      chart: plex
      version: 23.1.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: plex.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: 192.168.10.217
        integrations:
          metallb:
            enabled: true
    plex:
      # advertised to clients (was the NAS IP .150 on K3s); UDR forwards WAN 32400 here
      serverIP: 192.168.10.217
      disableGDM: true
      requireHTTPS: false
    persistence:
      # Preferences.xml + library DB stay on the NAS (as on K3s), media read from NFS
      config:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: /mnt/nvme-storage/k8s/plex/config
        mountPath: /config
        autoPermissions:
          enabled: false
      media:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_MULTIMEDIA}
        mountPath: /data
        autoPermissions:
          enabled: false
      transcode:
        enabled: true
        type: emptyDir
        # on disk, not RAM: no GPU until W4b, CPU transcodes write a lot
        medium: ""
        mountPath: /transcode
        targetSelectAll: true
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: false
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    resources:
      limits:
        cpu: 6000m
        memory: 6Gi
      requests:
        cpu: 500m
        memory: 1Gi
    image:
      tag: 1.43.5.11079 # = K3s version: library DB shared over NFS during the rollback window
