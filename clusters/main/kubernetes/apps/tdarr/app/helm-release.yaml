---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr
  namespace: tdarr
spec:
  interval: 15m
  chart:
    spec:
      chart: tdarr
      version: 16.1.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Zurich
    # Libraries/transcoding are configured in the UI after the GPU passthrough (RTX 2070).
    persistence:
      configs:
        enabled: true
        type: pvc
        size: 1Gi
        storageClass: truenas-iscsi
      # server DB (SQLite) + backups
      server:
        enabled: true
        type: pvc
        size: 5Gi
        storageClass: truenas-iscsi
      logs:
        enabled: true
        type: pvc
        size: 1Gi
        storageClass: truenas-iscsi
      # cache for in-progress transcodes: on the NAS next to the download cache (a remux can be 50+ GB)
      transcode-cache:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_DOWNLOAD_CACHE}/tdarr-cache
        mountPath: /temp
        autoPermissions:
          enabled: false
      media:
        enabled: false
      tv:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_MEDIA_TV}
        mountPath: /media/tv
        autoPermissions:
          enabled: false
      movies:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_MEDIA_MOVIES}
        mountPath: /media/movies
        autoPermissions:
          enabled: false
    # the image starts as root and drops to PUID/PGID: 1000 owns the media on the NAS (root is squashed)
    securityContext:
      container:
        PUID: 1000
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, media, monitoring
      ingress:
        enabled: true
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/media: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
    # Gateway API (migration/GATEWAY-API.md): TLS by the wildcard on the Gateway listener; integrations.traefik.enabled
    # keeps the chart's tc-basic-secure-headers middleware. Authelia: namespace-local middleware copy (ingressMiddlewares).
    route:
      main:
        enabled: true
        primary: true
        kind: HTTPRoute
        gateway: internal
        gatewayNamespace: traefik-internal
        hostnames:
          - tdarr.${DOMAIN_0}
        integrations:
          traefik:
            enabled: true
            middlewares:
              - name: forward-auth-authelia
    ingressMiddlewares:
      traefik:
        forward-auth-authelia:
          enabled: true
          type: forward-auth
          data:
            address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
            trustForwardHeader: false
            authResponseHeaders:
              - Remote-User
              - Remote-Groups
              - Remote-Name
              - Remote-Email
