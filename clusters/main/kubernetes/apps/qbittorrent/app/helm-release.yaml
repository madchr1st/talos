---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  interval: 15m
  chart:
    spec:
      chart: qbittorrent
      version: 26.2.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  valuesFrom:
    # SOPS-encrypted secrets (values-sec.yaml)
    - kind: Secret
      name: qbittorrent-values-sec
      valuesKey: values-sec.yaml
  values:
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: qbittorrent.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
          - host: qbt.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: forward-auth-authelia
                namespace: authelia
                expandObjectName: false
    persistence:
      # fastresume/state files -> block storage, copied from K3s
      config:
        enabled: true
        type: pvc
        size: 1Gi
        mountPath: /config
      download:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: /mnt/bulk-storage/downloads/k8s/download-cache
        mountPath: /downloads
        readOnly: false
        autoPermissions:
          enabled: false
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: false
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    # VPN as on K3s (AirVPN WireGuard). Keys/addresses + port-forward credentials: values-sec.yaml
    addons:
      gluetun:
        enabled: true
        container:
          env:
            VPN_SERVICE_PROVIDER: airvpn
            VPN_TYPE: wireguard
            SERVER_COUNTRIES: Sweden
            FIREWALL_VPN_INPUT_PORTS: "58955"
            DNS_KEEP_NAMESERVER: "off"
            WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: 16s
            # Cilium gives the pod a /32, so without these routes gluetun sends replies to kubelet probes and
            # traefik into the tunnel (on K3s the flannel /16 was "local"). Outbound subnets only take effect
            # with the gluetun firewall on, which also gives a kill switch (it was off on K3s).
            FIREWALL: "on"
            FIREWALL_INPUT_PORTS: "10095"
            FIREWALL_OUTBOUND_SUBNETS: "172.16.0.0/16,172.17.0.0/16,192.168.10.0/24"
    # QBT_TORRENTING_PORT is derived from the torrent port and rewritten into qBittorrent.conf on every start: keep it = AirVPN forwarded port
    service:
      torrent:
        ports:
          torrent:
            port: 58955
    # Ingress only (egress stays open). Kubelet probes come from the host and are always allowed.
    networkPolicy:
      # same namespace, Traefik, Prometheus, CNPG operator, callers: sonarr, radarr, prowlarr
      ingress:
        enabled: true
        policyType: ingress
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
          - from:
              - namespaceSelector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - traefik-internal
                        - traefik-external
                        - kube-prometheus-stack
                        - cloudnative-pg
                        - sonarr
                        - radarr
                        - prowlarr
