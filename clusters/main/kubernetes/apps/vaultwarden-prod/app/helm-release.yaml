---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden-prod
  namespace: vaultwarden-prod
spec:
  interval: 15m
  chart:
    spec:
      chart: vaultwarden
      version: 32.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  valuesFrom:
    # vaultwarden.* settings from K3s (admin token, SMTP, push, HIBP): SOPS-encrypted
    - kind: Secret
      name: vaultwarden-prod-values-sec
      valuesKey: values-sec.yaml
  values:
    database:
      type: postgresql
      wal: true
    cnpg:
      main:
        enabled: true
        user: vaultwarden
        database: vaultwarden
        pgVersion: 16
        # Bootstrapped from the K3s cluster's S3 backup + WAL (s3://.../vaultwarden-prod/cnpg)
        mode: recovery
        recovery:
          method: object_store
          credentials: mys3
        cluster:
          instances: 1
          singleNode: true
          storage:
            size: 5Gi
            storageClass: truenas-iscsi
          walStorage:
            size: 2Gi
            storageClass: truenas-iscsi
        monitoring:
          enablePodMonitor: true
        backups:
          enabled: true
          # new server name (-r1) so Talos never writes into the K3s backup
          revision: "1"
          credentials: mys3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 0 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          retentionPolicy: 30d
    credentials:
      mys3:
        type: s3
        url: ${CNPG_BACKUP_AWS_S3_URL}
        bucket: ${CNPG_BACKUP_AWS_S3_BUCKET}
        accessKey: ${CNPG_BACKUP_AWS_S3_ACCESS_KEY}
        secretKey: ${CNPG_BACKUP_AWS_S3_SECRET_KEY}
        encrKey: ${CNPG_BACKUP_AWS_S3_ENCRYPTION_KEY}
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: bitwarden.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            # as on K3s: Authelia in front (its access rules let the Bitwarden client API through)
            middlewares:
              - name: forward-auth-authelia
                namespace: authelia
                expandObjectName: false
      ext:
        enabled: true
        ingressClassName: traefik-external
        hosts:
          - host: bitwarden.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: forward-auth-authelia
                namespace: authelia
                expandObjectName: false
    persistence:
      # RSA keys, attachments, sends, icon cache: stay on the NAS (as on K3s), uid 1000
      data:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_VAULTWARDEN_PROD_DATA}
        mountPath: /data
        autoPermissions:
          enabled: false
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
      pod:
        fsGroup: 1000
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, monitoring
      ingress:
        enabled: true
        policyType: ingress
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
