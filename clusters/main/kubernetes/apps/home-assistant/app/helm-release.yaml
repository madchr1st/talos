---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 15m
  chart:
    spec:
      chart: home-assistant
      version: 33.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    credentials:
      mys3:
        type: s3
        url: ${CNPG_BACKUP_AWS_S3_URL}
        bucket: ${CNPG_BACKUP_AWS_S3_BUCKET}
        accessKey: ${CNPG_BACKUP_AWS_S3_ACCESS_KEY}
        secretKey: ${CNPG_BACKUP_AWS_S3_SECRET_KEY}
        encrKey: ${CNPG_BACKUP_AWS_S3_ENCRYPTION_KEY}
    addons:
      codeserver:
        enabled: true
        service:
          type: ClusterIP
          ports:
            codeserver:
              port: 36107
        route:
          enabled: true
          kind: HTTPRoute
          gateway: internal
          gatewayNamespace: traefik-internal
          hostnames:
            - home-assistant-edit.${DOMAIN_0}
          integrations:
            traefik:
              enabled: true
              # code-server can edit the whole HA config: SSO in front (it had none on K3s)
              middlewares:
                - name: forward-auth-authelia
    persistence:
      # copied from the K3s hostPath to block storage: HA runs as root, and the NFS share squashes root
      config:
        enabled: true
        type: pvc
        size: 5Gi
        mountPath: /config
        targetSelectAll: true
        storageClass: truenas-iscsi
    securityContext:
      container:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        readOnlyRootFilesystem: false
      pod:
        fsGroup: 568
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, monitoring + LoadBalancer/LAN ports
      ingress:
        enabled: true
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
          - from:
              - ipBlock:
                  cidr: 10.0.0.0/8
              - ipBlock:
                  cidr: 172.16.0.0/12
              - ipBlock:
                  cidr: 192.168.0.0/16
              - namespaceSelector:
                  matchLabels:
                    policy-group/tailscale: "true"
    dependencies:
      postgresql:
        enabled: true
        depconfig:
          postgresqlUsername: home-assistant
          postgresqlDatabase: home-assistant
          password: ${CNPG_DB_HOME_ASSISTANT_PASSWORD}
        operator:
          pgVersion: 16
          # Bootstrapped from the K3s cluster's S3 backup + WAL (s3://.../home-assistant/cnpg, server home-assistant-cnpg-main).
          # Keep mode/recovery: they only matter at cluster creation.
          mode: recovery
          recovery:
            method: object_store
            credentials: mys3
          cluster:
            instances: 1
            singleNode: true
            storage:
              size: 20Gi
              storageClass: truenas-iscsi
            walStorage:
              size: 10Gi
              storageClass: truenas-iscsi
          monitoring:
            enablePodMonitor: true
          backups:
            enabled: true
            # new server name (-r1) so Talos never writes into the K3s backup
            revision: "1"
            credentials: mys3
            scheduledBackups:
              - name: daily-backup
                schedule: "0 0 0 * * *"
                backupOwnerReference: self
                immediate: true
                suspend: false
            retentionPolicy: 30d
    # Gateway API (migration/GATEWAY-API.md): TLS by the wildcard on the Gateway listener; integrations.traefik.enabled
    # keeps the chart's tc-basic-secure-headers middleware. Authelia: namespace-local middleware copy (ingressMiddlewares).
    route:
      main:
        enabled: true
        primary: true
        kind: HTTPRoute
        gateway: internal
        gatewayNamespace: traefik-internal
        hostnames:
          - home-assistant.${DOMAIN_0}
        integrations:
          traefik:
            enabled: true
    ingressMiddlewares:
      traefik:
        forward-auth-authelia:
          enabled: true
          type: forward-auth
          data:
            address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
            trustForwardHeader: false
            authResponseHeaders:
              - Remote-User
              - Remote-Groups
              - Remote-Name
              - Remote-Email
