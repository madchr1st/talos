---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: blocky
spec:
  interval: 15m
  chart:
    spec:
      chart: blocky
      version: 24.3.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    ## set stopAll to "true" if you do not want to use blocky
    # and/or disable its service
    global:
      stopAll: false
    service:
      dns:
        externalTrafficPolicy: Local
        loadBalancerIP: ${BLOCKY_IP}
        type: LoadBalancer
        integrations:
          metallb:
            enabled: true
        ports:
          dot:
            enabled: true
            port: 853
            targetPort: 853
            protocol: tcp
      k8sgateway:
        enabled: false
    # k8s_gateway replaced by customDNS (values-sec.yaml): it doesn't see Traefik IngressRoutes and can answer
    # with the external ingress IP; customDNS maps ${DOMAIN_0} and all subdomains to traefik-internal.
    k8sgateway:
      # -- list of processed domains
      domains:
        - domain: "${DOMAIN_0}"
          # -- Optional configuration option for DNS01 challenge that will redirect all acme
          # challenge requests to external cloud domain (e.g. managed by cert-manager)
          # See: https://cert-manager.io/docs/configuration/acme/dns01/
          dnsChallenge:
            enabled: false
            domain: dns01.clouddns.com
      forward:
        enabled: false
        primary: tls://1.1.1.1
        secondary: tls://1.0.0.1
        options:
          - name: tls_servername
            value: cloudflare-dns.com
      enabled: false
    # CANNOT be defined in above yaml section
    queryLog:
      # optional one of: mysql, postgresql, csv, csv-client. If empty, log to console only
      type: "postgresql"
      logRetentionDays: 90
    configmap:
      dashboard:
        enabled: true
      datasource:
        enabled: true
    redis:
      persistence:
        data:
          size: 1Gi
    # cnpg config
    cnpg:
      main:
        enabled: true
        cluster:
          instances: 1
          storage:
            size: "2Gi"
          walStorage:
            size: "2Gi"
        monitoring:
          enablePodMonitor: true
    # Upstreams over DoH/DoT instead of plain DNS to ten public resolvers (same provider as AdGuard:
    # Cloudflare with malware blocking, Quad9 as a second, also filtering, provider).
    defaultUpstreams:
      - https://security.cloudflare-dns.com/dns-query
      - tcp-tls:security.cloudflare-dns.com
      - tcp-tls:dns.quad9.net
    # resolves the upstream host names; DoT by IP (Cloudflare's certificate covers 1.1.1.1)
    bootstrapDns:
      upstream: tcp-tls:1.1.1.1
    # DoT on the LoadBalancer IP with the Let's Encrypt certificate (encrypted-dns.yaml), port added to the
    # existing dns service: the common chart shares a MetalLB IP only for externalTrafficPolicy Cluster.
    certFile: /certs/tls.crt
    keyFile: /certs/tls.key
    persistence:
      tls:
        enabled: true
        type: secret
        objectName: dns-tls
        expandObjectName: false
        readOnly: true
        targetSelector:
          main:
            main:
              mountPath: /certs
    customDNS:
      customTTL: 1h
      filterUnmappedTypes: true
    # AdGuard parity: lean lists (HaGeZi Pro + TIF medium + OISD Big) in "Wildcard Asterisk" format (*.domain; Blocky
    # matches plain domain entries exactly, without subdomains), the AdGuard
    # "blocked services" as an inline wildcard group, AdGuard's allow rules. Client groups (which IPs get which
    # groups) and all IP mappings are in values-sec.yaml.
    blocking:
      blacklist:
        - name: lean
          lists:
            - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro.txt
            - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.medium.txt
            - https://big.oisd.nl/domainswild
        - name: services
          lists:
            - |
              *.tiktok.com
              *.tiktokv.com
              *.tiktokcdn.com
              *.tiktokcdn-us.com
              *.tiktokv.us
              *.byteoversea.com
              *.ibytedtos.com
              *.musical.ly
              *.ttwstatic.com
              *.temu.com
              *.kwcdn.com
              *.wechat.com
              *.weixin.qq.com
              *.wechatapp.com
              *.weibo.com
              *.weibo.cn
              *.sinaimg.cn
              *.mail.ru
              *.imgsmail.ru
              *.ok.ru
              *.odnoklassniki.ru
              *.mycdn.me
              *.zhihu.com
              *.zhimg.com
              *.xiaohongshu.com
              *.xhscdn.com
              *.yy.com
              *.yystatic.com
      whitelist:
        - name: lean
          lists:
            - |
              *.onesignal.com
              *.learn.cisecurity.org
              *.app-measurement.com
              *.app.community.engage.redhat.com
              *.www.googletagmanager.com
              *.incoming.telemetry.mozilla.org
              *.sdk.split.io
              *.auth.split.io
              *.support.optimizely.com
              *.cdn.optimizely.com
              *.www.siderolabs.com
              *.vlscppe.microsoft.com
  valuesFrom:
    - kind: Secret
      name: blocky-values-sec
      valuesKey: values-sec.yaml
