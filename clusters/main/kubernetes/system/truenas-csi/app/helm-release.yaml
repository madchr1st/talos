---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-csi
  namespace: truenas-csi
spec:
  interval: 15m
  chart:
    spec:
      chart: truenas-csi
      version: 1.4.0
      sourceRef:
        kind: HelmRepository
        name: truenas-csi
        namespace: flux-system
      interval: 15m
  timeout: 10m
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    truenas:
      # TrueNAS UI/API listens on 8443; Let's Encrypt cert for the hostname -> TLS is verified
      url: wss://${TRUENAS_API_HOST}:8443/api/current
      defaultPool: nvme-storage
      nfsServer: ${NFS_SERVER_0}
      iscsiPortal: ${NFS_SERVER_0}:3260
      # API key of the TrueNAS user k8s-csi (truenas-api.secret.yaml, SOPS)
      existingSecret: truenas-api
      existingSecretKey: api-key
    storageClasses:
      # zvols under nvme-storage/k8s-csi, one iSCSI target per volume, only this node's initiator may log in
      - name: truenas-iscsi
        isDefault: false
        reclaimPolicy: Retain
        volumeBindingMode: WaitForFirstConsumer
        allowVolumeExpansion: true
        parameters:
          protocol: iscsi
          datasetPath: k8s-csi
          compression: LZ4
          sparse: "true"
          volblocksize: 16K
          csi.storage.k8s.io/fstype: ext4
          iscsi.initiators: iqn.2017-11.dev.talos:8fe921d5f063788f6242a96a9c714f1e
    volumeSnapshotClass:
      enabled: true
      name: truenas-iscsi
      deletionPolicy: Delete
  # The NAS hostname only resolves via Blocky, not via the cluster DNS (CoreDNS forwards to the node's upstreams).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/hostAliases
                value:
                  - ip: ${NFS_SERVER_0}
                    hostnames:
                      - ${TRUENAS_API_HOST}
          - target:
              kind: DaemonSet
            patch: |
              - op: add
                path: /spec/template/spec/hostAliases
                value:
                  - ip: ${NFS_SERVER_0}
                    hostnames:
                      - ${TRUENAS_API_HOST}
