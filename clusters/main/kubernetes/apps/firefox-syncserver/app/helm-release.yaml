---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefox-syncserver
  namespace: firefox-syncserver
spec:
  interval: 15m
  chart:
    spec:
      chart: firefox-syncserver
      version: 22.1.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  valuesFrom:
    # SOPS-encrypted secrets (values-sec.yaml)
    - kind: Secret
      name: firefox-syncserver-values-sec
      valuesKey: values-sec.yaml
  values:
    cnpg:
      main:
        enabled: true
        user: firefox-syncserver
        database: firefox-syncserver
        pgVersion: 16
        cluster:
          # single node: a 2nd instance adds RAM but no real HA; S3 backups stay enabled
          instances: 1
          singleNode: true
          storage:
            size: 5Gi
            storageClass: truenas-iscsi
          walStorage:
            size: 2Gi
            storageClass: truenas-iscsi
        monitoring:
          enablePodMonitor: true
        backups:
          enabled: true
          credentials: mys3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 0 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          retentionPolicy: 30d
    credentials:
      mys3:
        type: s3
        url: ${CNPG_BACKUP_AWS_S3_URL}
        bucket: ${CNPG_BACKUP_AWS_S3_BUCKET}
        accessKey: ${CNPG_BACKUP_AWS_S3_ACCESS_KEY}
        secretKey: ${CNPG_BACKUP_AWS_S3_SECRET_KEY}
        encrKey: ${CNPG_BACKUP_AWS_S3_ENCRYPTION_KEY}
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: firefox-sync.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
      ext:
        enabled: true
        ingressClassName: traefik-external
        hosts:
          - host: firefox-sync.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
    persistence:
      config:
        enabled: true
        type: pvc
        size: 1Gi
        mountPath: /config
        storageClass: truenas-iscsi
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                # FF_SYNCSERVER_SECRET: values-sec.yaml
                FF_SYNCSERVER_PUBLIC_URL: firefox-sync.${DOMAIN_0}
                FF_SYNCSERVER_ACCESSLOG: true
                FF_SYNCSERVER_LOGLEVEL: info
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, monitoring
      ingress:
        enabled: true
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
