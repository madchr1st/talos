---
# Traefik forward-auth middleware for apps on this cluster.
# Reference from an ingress (TrueCharts):
#   integrations.traefik.middlewares:
#     - name: forward-auth-authelia
#       namespace: authelia
#       expandObjectName: false
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth-authelia
  namespace: authelia
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: false
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
