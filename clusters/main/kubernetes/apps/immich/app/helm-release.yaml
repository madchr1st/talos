---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 15m
  chart:
    spec:
      chart: immich
      version: 35.7.11
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # pinned: Immich 3.x needs VectorChord instead of pgvecto.rs (DB migration) -> upgrade as a separate, tested step
    image:
      tag: v2.7.5
    mlImage:
      tag: v2.7.5
    cnpg:
      main:
        enabled: true
        user: immich
        database: immich
        pgVersion: 16
        # VectorChord (Immich 3.x); migrated from pgvecto.rs on 2026-11-19 (migration/UPGRADE-PAPERLESS-IMMICH.md)
        type: vectorchord
        # Bootstrapped from the K3s cluster's S3 backup + WAL (s3://.../immich/cnpg)
        mode: recovery
        recovery:
          method: object_store
          credentials: mys3
        cluster:
          instances: 1
          singleNode: true
          storage:
            size: 10Gi
          walStorage:
            size: 5Gi
        monitoring:
          enablePodMonitor: true
        backups:
          enabled: true
          # new server name (-r1) so Talos never writes into the K3s backup
          revision: "1"
          credentials: mys3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 0 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          retentionPolicy: 30d
    credentials:
      mys3:
        type: s3
        url: ${CNPG_BACKUP_AWS_S3_URL}
        bucket: ${CNPG_BACKUP_AWS_S3_BUCKET}
        accessKey: ${CNPG_BACKUP_AWS_S3_ACCESS_KEY}
        secretKey: ${CNPG_BACKUP_AWS_S3_SECRET_KEY}
        encrKey: ${CNPG_BACKUP_AWS_S3_ENCRYPTION_KEY}
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: immich.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
          - host: photos.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
      ext:
        enabled: true
        ingressClassName: traefik-external
        hosts:
          - host: immich.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
          - host: photos.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
    persistence:
      # photos/videos stay on the NAS (as on K3s), uid 1000
      library:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_LIBRARY}
        autoPermissions:
          enabled: false
      uploads:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_UPLOAD}
        autoPermissions:
          enabled: false
      backups:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_BACKUPS}
        autoPermissions:
          enabled: false
      thumbs:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_THUMBS}
        autoPermissions:
          enabled: false
      video:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_VIDEO}
        autoPermissions:
          enabled: false
      profile:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_IMMICH_PROFILE}
        autoPermissions:
          enabled: false
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    # Ingress only (egress stays open). Kubelet probes come from the host and are always allowed.
    networkPolicy:
      # same namespace, Traefik, Prometheus, CNPG operator
      ingress:
        enabled: true
        policyType: ingress
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
          - from:
              - namespaceSelector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - traefik-internal
                        - traefik-external
                        - kube-prometheus-stack
                        - cloudnative-pg
    # TEMPORARY: Immich stopped during the pgvecto.rs -> VectorChord migration (migration/UPGRADE-PAPERLESS-IMMICH.md)
    workload:
      main:
        replicas: 0
      microservices:
        replicas: 0
      machinelearning:
        replicas: 0
