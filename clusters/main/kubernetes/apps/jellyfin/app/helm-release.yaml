---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 15m
  chart:
    spec:
      chart: jellyfin
      version: 25.3.6
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: oci.trueforge.org/containerforge/jellyfin
      pullPolicy: IfNotPresent
      tag: 12.4.0 # = K3s version: config is shared over NFS, a newer version migrates the DB and breaks rollback. Upgrade after the rollback window.
    ingress:
      main:
        enabled: true
        hosts:
          - host: jellyfin.hallernet.ch
            paths:
              - path: /
                pathType: Prefix
        ingressClassName: traefik-internal
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
      ext:
        enabled: true
        hosts:
          - host: jellyfin.hallernet.ch
            paths:
              - path: /
                pathType: Prefix
        ingressClassName: traefik-external
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares: []
    persistence:
      cache:
        enabled: true
        mountPath: /cache
        type: emptyDir
      config:
        autoPermissions:
          enabled: false
        enabled: true
        mountPath: /config
        readOnly: false
        type: nfs
        path: ${NFS_PATH_JELLYFIN_CONFIG}
        server: ${NFS_SERVER_0}
      data:
        autoPermissions:
          enabled: false
        enabled: true
        mountPath: /data
        readOnly: false
        type: nfs
        path: ${NFS_PATH_JELLYFIN_DATA}
        server: ${NFS_SERVER_0}
      media:
        autoPermissions:
          enabled: false
        enabled: true
        # hostPath: /mnt/bulk-storage/multimedia
        mountPath: /media
        readOnly: false
        # type: hostPath
        type: nfs
        path: ${NFS_PATH_MULTIMEDIA}
        server: ${NFS_SERVER_0}
      transcode:
        autoPermissions:
          enabled: false
        enabled: true
        mountPath: /config/transcodes
        type: emptyDir
        medium: "" # disk, not RAM: CPU transcodes until the GPU arrives
    resources:
      limits:
        cpu: 6000m
        memory: 6Gi
      requests:
        cpu: 100m
        memory: 512Mi
    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsGroup: 1000
        runAsUser: 1000
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: []
    service:
      autodiscovery:
        enabled: true
        ports:
          autodiscovery:
            enabled: true
            port: 7359
            protocol: udp
            targetPort: 7359
      main:
        enabled: true
        ports:
          main:
            port: 8096
            targetPort: 8096
        type: ClusterIP
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                JELLYFIN_DATA_DIR: /data
                JELLYFIN_CONFIG_DIR: /config
                JELLYFIN_LOG_DIR: /logs
                JELLYFIN_CACHE_DIR: /cache
                JELLYFIN_PublishedServerUrl: '{{ $.Values.chartContext.appUrl }}'
        replicas: 1
        type: Deployment
    # Ingress only (egress stays open). Kubelet probes come from the host and are always allowed.
    networkPolicy:
      # same namespace, Traefik, Prometheus, CNPG operator
      ingress:
        enabled: true
        policyType: ingress
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
          - from:
              - namespaceSelector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - traefik-internal
                        - traefik-external
                        - kube-prometheus-stack
                        - cloudnative-pg
