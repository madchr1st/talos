---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: blocky
spec:
  interval: 15m
  chart:
    spec:
      chart: blocky
      version: 24.3.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    ## set stopAll to "true" if you do not want to use blocky
    # and/or disable its service
    global:
      stopAll: false
    service:
      dns:
        externalTrafficPolicy: Local
        loadBalancerIP: ${BLOCKY_IP}
        type: LoadBalancer
        integrations:
          metallb:
            enabled: true
    k8sgateway:
      # -- list of processed domains
      domains:
      - domain: "${DOMAIN_0}"
        # -- Optional configuration option for DNS01 challenge that will redirect all acme
        # challenge requests to external cloud domain (e.g. managed by cert-manager)
        # See: https://cert-manager.io/docs/configuration/acme/dns01/
        dnsChallenge:
          enabled: false
          domain: dns01.clouddns.com

      forward:
        enabled: false
        primary: tls://1.1.1.1
        secondary: tls://1.0.0.1
        options:
          - name: tls_servername
            value: cloudflare-dns.com

    # CANNOT be defined in above yaml section
    queryLog:
      # optional one of: mysql, postgresql, csv, csv-client. If empty, log to console only
      type: ""

    configmap:
      dashboard:
        enabled: true
      datasource:
        enabled: true

    redis:
      persistence:
        data:
          size: 1Gi

    # cnpg config
    cnpg:
      main:
        enabled: true
        cluster:
          instances: 2
          storage:
            size: "2Gi"
          walStorage:
            size: "2Gi"
        monitoring:
          enablePodMonitor: true
    # Upstreams over DoH/DoT instead of plain DNS to ten public resolvers (same provider as AdGuard:
    # Cloudflare with malware blocking, Quad9 as a second, also filtering, provider).
    defaultUpstreams:
      - https://security.cloudflare-dns.com/dns-query
      - tcp-tls:security.cloudflare-dns.com
      - tcp-tls:dns.quad9.net
    # resolves the upstream host names; DoT by IP (Cloudflare's certificate covers 1.1.1.1)
    bootstrapDns:
      upstream: tcp-tls:1.1.1.1
    blockyConfig:
      ports:
        # DoT (:853) is only reachable through traefik-internal, which adds the PROXY header (encrypted-dns.yaml)
        proxyProtocol:
          - tls
