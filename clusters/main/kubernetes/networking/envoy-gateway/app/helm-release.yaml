---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 15m
  chart:
    spec:
      chart: gateway-helm
      # keep in step with the CRD tag in repositories/git/envoy-gateway.yaml
      version: v1.10.0
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # https://gateway.envoyproxy.io/docs/install/gateway-helm-api/
    # CRDs come from Flux: Gateway API (system/gateway-api), Envoy Gateway (envoy-gateway-crds)
    crds:
      enabled: false
