---
# Traefik forward-auth middleware for apps on this cluster.
# Reference from an ingress (TrueCharts):
#   integrations.traefik.middlewares:
#     - name: forward-auth-authelia
#       namespace: authelia
#       expandObjectName: false
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth-authelia
  namespace: authelia
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: false
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
---
# TEMPORARY (K3s -> Talos migration): lets the forward-auth middleware of the old
# TrueNAS K3s Traefik reach this Authelia directly, so K3s-hosted apps keep their SSO
# while Authelia runs here. Remove once the last app has left K3s (migration wave W5).
apiVersion: v1
kind: Service
metadata:
  name: authelia-lan
  namespace: authelia
  annotations:
    metallb.io/ip-allocated-from-pool: main
    metallb.io/loadBalancerIPs: 192.168.10.223
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/instance: authelia
    app.kubernetes.io/name: authelia
    pod.name: main
  ports:
    - name: http
      port: 9091
      targetPort: 9091
      protocol: TCP
