---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  interval: 15m
  chart:
    spec:
      chart: qbittorrent
      version: 26.2.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  valuesFrom:
    # SOPS-encrypted secrets (values-sec.yaml)
    - kind: Secret
      name: qbittorrent-values-sec
      valuesKey: values-sec.yaml
  values:
    ingress:
      main:
        enabled: true
        primary: true
        ingressClassName: traefik-internal
        hosts:
          - host: qbittorrent.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
          - host: qbt.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: forward-auth-authelia
                namespace: authelia
                expandObjectName: false
    persistence:
      # fastresume/state files -> block storage, copied from K3s
      config:
        enabled: true
        type: pvc
        size: 1Gi
        mountPath: /config
        storageClass: truenas-iscsi
      download:
        enabled: true
        type: nfs
        server: ${NFS_SERVER_0}
        path: ${NFS_PATH_DOWNLOAD_CACHE}
        mountPath: /downloads
        readOnly: false
        autoPermissions:
          enabled: false
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: false
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    # Upstream gluetun: the TrueForge mirror (tccr) stops at v3.40.0, whose built-in server list is from 2024
    # and mostly decommissioned servers
    gluetunImage:
      repository: docker.io/qmcgaw/gluetun
      tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    # VPN (WireGuard). In values-sec.yaml: provider (VPN_SERVICE_PROVIDER, UPDATER_VPN_SERVICE_PROVIDERS),
    # SERVER_COUNTRIES, forwarded port (FIREWALL_VPN_INPUT_PORTS + service.torrent port), keys/addresses and
    # port-forward credentials
    addons:
      gluetun:
        enabled: true
        container:
          env:
            VPN_TYPE: wireguard
            DNS_KEEP_NAMESERVER: "off"
            WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: 16s
            # Even the image's server list goes stale: refresh it from the provider API while running, so a VPN
            # restart does not pick a retired server. First refresh one period after start.
            UPDATER_PERIOD: 1h
            # Cilium gives the pod a /32, so without these routes gluetun sends replies to kubelet probes and
            # traefik into the tunnel (on K3s the flannel /16 was "local"). Outbound subnets only take effect
            # with the gluetun firewall on, which also gives a kill switch (it was off on K3s).
            FIREWALL: "on"
            FIREWALL_INPUT_PORTS: "10095"
            FIREWALL_OUTBOUND_SUBNETS: "${PODNET},${SVCNET},${LAN_NET}"
    # Ingress only (egress stays open), by policy group (gen-netpols.py). Kubelet probes are always allowed.
    networkPolicy:
      # same namespace + groups: cnpg-operator, ingress, media, monitoring
      ingress:
        enabled: true
        policyType: ingress
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: Exists
        ingress:
          - from:
              - podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: Exists
              - namespaceSelector:
                  matchLabels:
                    policy-group/cnpg-operator: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/ingress: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/media: "true"
              - namespaceSelector:
                  matchLabels:
                    policy-group/monitoring: "true"
