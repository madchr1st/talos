# Weekly right-sizing report (KRR, simple strategy) -> ntfy topic "krr". See CLAUDE.md "Right-sizing (KRR)".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: krr
  namespace: krr
spec:
  schedule: "0 6 * * 1"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: krr
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: krr
              image: robustadev/krr:v1.31.3
              workingDir: /app
              command:
                - python
                - krr.py
                - simple
                - --prometheus-url=http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc:9090
                - --cpu-min=10
                - --mem-min=64
                - --formatter=json
                - --fileoutput=/work/krr.json
              env:
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: report
              image: python:3.13.18-slim
              command: ["cat", "/work/krr.json"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
